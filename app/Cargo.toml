[package]
name = "openmp"
version = "1.5.0"
description = "OpenMP – odtwarzacz muzyki i wideo dla Windows"
authors = ["Adam Rędzikowski"]
edition = "2021"
rust-version = "1.80"

[[bin]]
name = "OpenMP"
path = "src/main.rs"

[dependencies]
openmp-core = { path = "../core" }
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "accessibility", "backend-winit", "renderer-femtovg", "unstable-winit-030"] }
raw-window-handle = "0.6"
glow = "0.16"
souvlaki = "0.8"
rfd = "0.15"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
ureq = "2"
crossbeam-channel = "0.5"
rand = "0.9"
paste = "1"
notify = "6"

[dependencies.windows]
version = "0.61"
features = ["Win32_Foundation", "Win32_System_Power", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_UI_Shell", "Win32_System_Threading", "Win32_System_Com", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse"]

[build-dependencies]
slint-build = "1.18"
winresource = "0.1"
